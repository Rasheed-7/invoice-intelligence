[project]
name = "invoice-intelligence-backend"
version = "0.1.0"
description = "AI Invoice Intelligence & Compliance Platform - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "PyMuPDF>=1.24.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042 suggests enum.StrEnum over (str, enum.Enum). The models intentionally
# use (str, enum.Enum) - see app/models/enums.py - to keep the "str + Enum"
# pattern used throughout the codebase, so the rule is disabled.
ignore = ["UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # starlette's TestClient emits StarletteDeprecationWarning (a UserWarning
    # subclass) via stacklevel=2, so it is attributed to the importing module
    # (fastapi.testclient) rather than starlette.testclient. Target the exact
    # warning class and match either module.
    "ignore::starlette.exceptions.StarletteDeprecationWarning:(starlette.testclient|fastapi.testclient)",
]