services:
  postgres:
    # pgvector extension is enabled by the Step 17 migration; the image ships it.
    image: pgvector/pgvector:pg16
    container_name: invoice_intelligence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: